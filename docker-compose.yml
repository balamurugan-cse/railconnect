version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-railconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-railconnect_secret}
      POSTGRES_DB: ${DB_NAME:-railconnect_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railconnect -d railconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railconnect-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
